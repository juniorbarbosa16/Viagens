name: Verificar preço LATAM

on:
  schedule:
    # A cada 20 minutos. O GitHub não garante o horário exato (pode
    # atrasar um pouco em horários de pico), mas fica na faixa certa.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write  # necessário pra o workflow conseguir salvar o CSV de volta no repositório

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do navegador do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Rodar a busca da janela
        env:
          URL_BASE: ${{ secrets.URL_BASE }}
          DATA_INICIO: "2026-09-19"   # ajuste pra data de início do período
          DIAS_TOTAIS: "30"
          DURACAO: "8"
          LIMITE_PRECO: "22000"
        run: xvfb-run -a python buscar_uma_janela.py

      - name: Salvar resultado de volta no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_precos.csv estado.json
          git diff --staged --quiet || git commit -m "Atualiza histórico de preços"
          git push
